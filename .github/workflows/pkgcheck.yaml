# rOpenSci pkgcheck, in the image of https://github.com/ropensci-review-tools/pkgcheck-action
# but with our own script (.github/pkgcheck.R), which works around a failure of the action
# when it writes its summary (pkgcheck-action issue #77).
name: pkgcheck

# Run by hand (Actions > pkgcheck > Run workflow) before a release or a submission: it takes
# about 40 minutes.
on:
  workflow_dispatch:

permissions: read-all

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run pkgcheck
        uses: docker://ghcr.io/ropensci-review-tools/pkgcheck-action:latest
        env:
          # pkgcheck reads the CI badges and runs through the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          entrypoint: Rscript
          args: .github/pkgcheck.R

      - name: Show the summary
        if: always()
        run: |
          if [ -f .pkgcheck/summary.md ]; then cat .pkgcheck/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pkgcheck-results
          path: .pkgcheck/*.md
          if-no-files-found: ignore
